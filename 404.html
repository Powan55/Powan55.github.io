<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <title>Page not found | Laxmi Poudel</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f5f7fc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding-block: var(--space-6); }
    .nf p:not(.kicker) { color: var(--text-muted); margin-bottom: var(--space-4); }
  </style>
</head>
<body>
  <main class="nf">
    <div class="container">
      <p class="kicker">404</p>
      <h1 class="section-title">Page not found</h1>
      <p>That page doesn't exist or has moved.</p>
      <a class="btn btn-primary" href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
